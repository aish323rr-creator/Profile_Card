<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }
        .container{
            height: 600px;
            /* border: 1px solid black; */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            height: 80%;
            width: 80%;
            display: flex;
            /* border: 1px solid black; */
             box-shadow: 10px 10px 10px;
             border-radius: 20px;
        }
        .left,.center,.right{
            height: 100%;
            /* border: 1px solid black; */
        }
        .left{
            width: 3%;
            background-color: navy;
            border-radius: 20px;
        }
        .center{
            width: 62%;
            background-color: whitesmoke;
        }
        .center>h1{
            font-size: 115px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: navy;
            margin-left: 15px;
        }
        .right{
            width: 35%;
            border-radius: 20px;
        }
        .top{
            height: 30%;
            /* border: 1px solid black; */
        }
        .bottom{
            height: 70%;
            /* border: 1px solid black; */
        }
        .top-in{
            height: 90%;
            background-color: navy;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .circle{
            position: absolute;
            height: 125px;
            width: 125px;
            border: 5px solid navy;
            border-radius: 50%;
            top: 80px;
            right: 265px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 5px solid white;
        }
        .bottom>h1{
            text-align: center;
        }
        .button{
            height: 20%;
            /* border: 1px solid black; */
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .button1{
            color: white;
            height: 50%;
            width: 40%;
            background-color: navy;
            border-radius: 20px;
            text-align: center;
            line-height: 30px;
        }
        .icon{
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .fa-facebook{
            color: blue;
        }
        .fa-instagram{
            background: linear-gradient(purple,red,orange);
            color: transparent;
            background-clip: text;
        }
        .fa-linkedin{
            color: rgb(19, 77, 235);
        }
        .fa-github{
            color: violet;
        }
        .fa-behance{
            color: green;
        }
        .fa-heart{
            color: red;
        }
        .fa-comment{
            color: rgb(0, 166, 255);
        }
        .fa-share{
            color: rgb(26, 179, 85);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="left"></div>
            <div class="center"> <h1>Profile Card UI UX Design</h1>
            </div>
            <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="e4c0fffe-ae85-4c36-aff8-29416419de19_AA8DE5E6-F631-46F1-A46B-D1BEA1FADCC2.jpg" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                  <h1>Website Developer</h1>
                  <h1>Dezyne École College</h1>
                  <h1>BCA 1st Year</h1>
                  <div class="icon">
                    <i class="fa fa-brands fa-facebook fa-2x"></i>
                    <i class="fa fa-brands fa-instagram fa-2x"></i>
                    <i class="fa fa-brands fa-linkedin fa-2x"></i>
                    <i class="fa fa-brands fa-github fa-2x"></i>
                    <i class="fa fa-brands fa-behance fa-2x"></i>
                  </div>
                  <div class="button">
                    <div class="button1">Subscribe</div>
                    <div class="button1">Message</div>
                  </div>
                  <div class="icon">
                    <i class="fa fa-solid fa-heart fa-2x"></i>60.4K
                    <i class="fa fa-solid fa-comment fa-2x"></i>20K
                    <i class="fa fa-solid fa-share fa-2x"></i>12.2K
                   
                  </div>
                  
                </div>
            </div>
        </div>
    </div>
</body>
</html>
